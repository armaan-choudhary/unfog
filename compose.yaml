services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: unfog
      POSTGRES_USER: unfog
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unfog -d unfog"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - unfog-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://unfog:local-only-change-me@postgres:5432/unfog
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: backend
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://unfog:local-only-change-me@postgres:5432/unfog
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  unfog-postgres-data:
